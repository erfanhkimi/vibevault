<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VibeVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <span class="title">VibeVault</span>
      <button id="btn-open-dash">Dashboard &rarr;</button>
    </header>

    <div class="form-group">
      <label for="input-title">Page Title</label>
      <input type="text" id="input-title" placeholder="Loading page title..." />
    </div>

    <div class="form-group">
      <label for="input-url">URL</label>
      <input type="text" id="input-url" readonly />
    </div>

    <div class="form-group">
      <label for="input-note">Why I Saved This <span class="required">*</span></label>
      <textarea id="input-note" rows="3" placeholder="Context, rationale, or intended usage..."></textarea>
    </div>

    <div class="row">
      <div class="form-group half">
        <label for="select-collection">Collection</label>
        <select id="select-collection">
          <option value="Design">Design</option>
          <option value="Dev">Dev</option>
          <option value="Articles">Articles</option>
          <option value="Music">Music</option>
          <option value="General" selected>General</option>
        </select>
      </div>

      <div class="form-group half">
        <label for="input-tags">Tags</label>
        <input type="text" id="input-tags" placeholder="ui, architecture, reference" />
      </div>
    </div>

    <button id="btn-save" class="btn-primary">Save Reference</button>
    <div id="status-msg" class="status-msg">Saved to local vault</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
